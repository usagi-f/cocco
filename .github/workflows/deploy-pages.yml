name: Deploy to GitHub Pages

# gh-pages ブランチへサイトを公開する。GitHub は gh-pages ブランチが
# 作られると自動的に Pages を有効化するため、リポジトリ設定の変更が不要。
on:
  push:
    branches:
      - main
      - claude/phaser-cat-paw-game-hwb7uo
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          exclude_assets: '.github'
